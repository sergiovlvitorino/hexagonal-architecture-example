spring.graphql.graphiql.enabled=true
spring.graphql.schema.introspection.enabled=false
spring.threads.virtual.enabled=true
spring.h2.console.enabled=false
cors.allowed-origins=http://localhost:8080
pagination.max-page-size=1000

# JPA / Hibernate performance
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=hexagonal-architecture-example

# Rate limiting
ratelimit.capacity=100
ratelimit.refill-minutes=1
ratelimit.trust-proxy=false
ratelimit.cache-maximum-size=100000

# Flyway (desabilitado em dev/test; ativado apenas no profile prod)
spring.flyway.enabled=false

# OpenAPI / Swagger
# springdoc-openapi serves only the Swagger UI shell; the spec source-of-truth is users.yaml (SDD).
# api-docs generation from annotations is disabled — the static YAML is the contract (see ADR-0006).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi/users.yaml
