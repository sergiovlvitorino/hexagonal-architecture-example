# Enable GraphQL interactive UI (disable in production if not needed)
spring.graphql.graphiql.enabled=true

# Disable schema introspection to prevent schema enumeration attacks
spring.graphql.schema.introspection.enabled=false

# Enable virtual threads for improved concurrency (Java 21+)
spring.threads.virtual.enabled=true

# Disable H2 web console to prevent unauthorized database access
spring.h2.console.enabled=false

# CORS: comma-separated list of allowed origins (override per environment)
app.cors.allowed-origins=http://localhost:8080
